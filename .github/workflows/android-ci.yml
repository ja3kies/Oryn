name: Android CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'security/**'

permissions:
  contents: read

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Restore persistent debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ORYN_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/oryn-debug.p12"
          chmod 600 "$RUNNER_TEMP/oryn-debug.p12"

      - name: Assemble debug
        env:
          ORYN_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/oryn-debug.p12
          ORYN_DEBUG_STORE_PASSWORD: ${{ secrets.ORYN_DEBUG_STORE_PASSWORD }}
          ORYN_DEBUG_KEY_PASSWORD: ${{ secrets.ORYN_DEBUG_KEY_PASSWORD }}
          ORYN_DEBUG_KEY_ALIAS: ${{ secrets.ORYN_DEBUG_KEY_ALIAS }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oryn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
