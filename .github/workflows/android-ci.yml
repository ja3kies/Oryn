name: Android CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'security/**'
      - 'feat/oryn-reader-150'

permissions:
  contents: read

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Restore persistent debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ORYN_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/oryn-debug.p12"
          chmod 600 "$RUNNER_TEMP/oryn-debug.p12"

      - name: JVM regression tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug
        env:
          ORYN_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/oryn-debug.p12
          ORYN_DEBUG_STORE_PASSWORD: ${{ secrets.ORYN_DEBUG_STORE_PASSWORD }}
          ORYN_DEBUG_KEY_PASSWORD: ${{ secrets.ORYN_DEBUG_KEY_PASSWORD }}
          ORYN_DEBUG_KEY_ALIAS: ${{ secrets.ORYN_DEBUG_KEY_ALIAS }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK identity, version and signing certificate
        env:
          ORYN_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/oryn-debug.p12
          ORYN_DEBUG_STORE_PASSWORD: ${{ secrets.ORYN_DEBUG_STORE_PASSWORD }}
          ORYN_DEBUG_KEY_ALIAS: ${{ secrets.ORYN_DEBUG_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$AAPT" && test -x "$SIGNER"
          INFO="$("$AAPT" dump badging "$APK" | grep '^package:')"
          echo "$INFO" | grep -q "name='com.example.oryn.reader'"
          echo "$INFO" | grep -q "versionCode='2'"
          echo "$INFO" | grep -q "versionName='1.1.0'"
          "$SIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/oryn-signature.txt"
          EXPECTED="$(keytool -exportcert -alias "$ORYN_DEBUG_KEY_ALIAS" -keystore "$ORYN_DEBUG_KEYSTORE_PATH" -storetype PKCS12 -storepass "$ORYN_DEBUG_STORE_PASSWORD" 2>/dev/null | sha256sum | cut -d' ' -f1)"
          ACTUAL="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/oryn-signature.txt" | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$ACTUAL" && test "$EXPECTED" = "$ACTUAL"
          echo "PACKAGE_AND_SIGNATURE=VERIFIED"
          echo "$INFO"

      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oryn-jvm-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oryn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
