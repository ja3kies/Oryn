name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'security/**'
      - 'design/**'

permissions:
  contents: read

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Restore shared Termux debug keystore
        env:
          ORYN_KEYSTORE_BASE64: ${{ secrets.ORYN_KEYSTORE_BASE64 }}
        run: |
          test -n "$ORYN_KEYSTORE_BASE64" || { echo "Missing ORYN_KEYSTORE_BASE64 repository secret"; exit 1; }
          echo "$ORYN_KEYSTORE_BASE64" | base64 --decode > app/oryn-debug.keystore
          chmod 600 app/oryn-debug.keystore

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oryn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
