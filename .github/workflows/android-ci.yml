name: Android CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'security/**'
      - 'feat/oryn-reader-150'

permissions:
  contents: read

# PR and push events for the same source branch validate the same commit once.
concurrency:
  group: android-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate Android and build test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Artifact identity is the tested development commit, including PR-triggered runs.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Restore persistent debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ORYN_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/oryn-debug.p12"
          chmod 600 "$RUNNER_TEMP/oryn-debug.p12"

      - name: JVM, lint, debug, release and instrumented-test compilation
        env:
          ORYN_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/oryn-debug.p12
          ORYN_DEBUG_STORE_PASSWORD: ${{ secrets.ORYN_DEBUG_STORE_PASSWORD }}
          ORYN_DEBUG_KEY_PASSWORD: ${{ secrets.ORYN_DEBUG_KEY_PASSWORD }}
          ORYN_DEBUG_KEY_ALIAS: ${{ secrets.ORYN_DEBUG_KEY_ALIAS }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --continue --stacktrace

      - name: Verify locked community features in packaged APKs
        run: python3 scripts/check-community-release.py

      - name: Verify APK identity, version and signing certificate
        env:
          ORYN_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/oryn-debug.p12
          ORYN_DEBUG_STORE_PASSWORD: ${{ secrets.ORYN_DEBUG_STORE_PASSWORD }}
          ORYN_DEBUG_KEY_ALIAS: ${{ secrets.ORYN_DEBUG_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$AAPT" && test -x "$SIGNER"
          INFO="$("$AAPT" dump badging "$APK" | grep '^package:')"
          echo "$INFO" | grep -q "name='com.example.oryn.reader'"
          # Keep package identity pinned; read version expectations from this
          # build's Gradle source instead of freezing future QA releases.
          EXPECTED_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          EXPECTED_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$EXPECTED_CODE" && test -n "$EXPECTED_NAME"
          echo "$INFO" | grep -Fq "versionCode='$EXPECTED_CODE'"
          echo "$INFO" | grep -Fq "versionName='$EXPECTED_NAME'"
          "$SIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/oryn-signature.txt"
          EXPECTED="$(keytool -exportcert -alias "$ORYN_DEBUG_KEY_ALIAS" -keystore "$ORYN_DEBUG_KEYSTORE_PATH" -storetype PKCS12 -storepass "$ORYN_DEBUG_STORE_PASSWORD" 2>/dev/null | sha256sum | cut -d' ' -f1)"
          ACTUAL="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/oryn-signature.txt" | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$ACTUAL" && test "$EXPECTED" = "$ACTUAL"
          echo "PACKAGE_AND_SIGNATURE=VERIFIED"
          echo "$INFO"
          printf 'commit=%s\napk_sha256=%s\ncertificate_sha256=%s\n' \
            "$(git rev-parse HEAD)" "$(sha256sum "$APK" | cut -d' ' -f1)" "$ACTUAL" \
            | tee app/build/outputs/apk/debug/build-info.txt

      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oryn-jvm-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oryn-lint-reports
          path: app/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oryn-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/oryn-debug.p12"
