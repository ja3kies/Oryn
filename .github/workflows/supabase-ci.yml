name: Supabase CI

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-ci.yml"
  push:
    branches:
      - main
      - "feature/community-epub-catalog"
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-ci.yml"

permissions:
  contents: read

concurrency:
  group: supabase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Supabase backend
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Show tool versions
        run: |
          supabase --version
          deno --version
          docker --version

      # This starts a disposable local Supabase stack inside the GitHub runner.
      # It does not link to, read from, or modify the production project.
      - name: Start disposable Supabase stack
        run: supabase start

      - name: Rebuild local database from migrations
        run: supabase db reset

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run database security assertions
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | awk -F '"' '/^DB_URL=/{print $2}')"
          if [[ -z "$DB_URL" ]]; then
            echo "Could not obtain the local Supabase DB_URL." >&2
            exit 1
          fi
          psql "$DB_URL" --set ON_ERROR_STOP=1 --file supabase/tests/community_catalog_security.sql

      - name: Start local Edge Functions for integration tests
        shell: bash
        run: |
          set -euo pipefail
          cleanup_secret="$(openssl rand -hex 32)"
          printf 'CATALOG_CLEANUP_SECRET=%s\\n' "$cleanup_secret" > /tmp/oryn-functions.env
          echo "CATALOG_CLEANUP_SECRET=$cleanup_secret" >> "$GITHUB_ENV"
          supabase functions serve --env-file /tmp/oryn-functions.env > /tmp/oryn-functions.log 2>&1 &
          echo $! > /tmp/oryn-functions.pid
          for attempt in $(seq 1 60); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \\
              --request POST http://127.0.0.1:54321/functions/v1/catalog-cleanup || true)"
            if [[ "$status" == "401" ]]; then
              echo "Local Edge Functions are ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/oryn-functions.log
          echo "Local Edge Functions did not become ready." >&2
          exit 1

      - name: Run Auth, RLS, Storage and quota integration tests
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export FUNCTIONS_URL="$API_URL/functions/v1"
          export CATALOG_CLEANUP_SECRET="${CATALOG_CLEANUP_SECRET}"
          deno test --allow-env --allow-net supabase/tests/community_catalog_integration_test.ts

      - name: Type-check all Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for function_dir in supabase/functions/catalog-*; do
            if [[ -f "$function_dir/index.ts" && -f "$function_dir/deno.json" ]]; then
              echo "::group::Type-check $(basename "$function_dir")"
              deno check --config "$function_dir/deno.json" "$function_dir/index.ts"
              echo "::endgroup::"
            fi
          done

      - name: Run Edge Function unit tests
        shell: bash
        run: |
          set -euo pipefail
          test_count=0
          for function_dir in supabase/functions/catalog-*; do
            test_file="$function_dir/validation_test.ts"
            config_file="$function_dir/deno.json"
            if [[ -f "$test_file" && -f "$config_file" ]]; then
              echo "::group::Unit tests $(basename "$function_dir")"
              deno test --config "$config_file" "$test_file"
              echo "::endgroup::"
              test_count=$((test_count + 1))
            fi
          done
          if [[ "$test_count" -eq 0 ]]; then
            echo "No Edge Function unit test files were found." >&2
            exit 1
          fi

      - name: Stop local Edge Functions
        if: always()
        run: |
          if [[ -f /tmp/oryn-functions.pid ]]; then kill "$(cat /tmp/oryn-functions.pid)" || true; fi
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
